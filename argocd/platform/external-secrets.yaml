apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: external-secrets
  namespace: argocd

spec:
  project: petclinic-project

  source:
    repoURL: https://github.com/petclinic-project/petclinic-infrastructure.git
    targetRevision: develop
    path: kubernetes/platform/external-secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
