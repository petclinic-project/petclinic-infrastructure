apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: aws-load-balancer-controller
  namespace: argocd

spec:
  project: petclinic-project

  source:
    repoURL: https://github.com/petclinic-project/petclinic-infrastructure.git
    targetRevision: develop
    path: kubernetes/platform/aws-load-balancer-controller

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
